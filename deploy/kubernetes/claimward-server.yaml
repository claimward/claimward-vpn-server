# Kubernetes: a Deployment and the Secret volume that carries the credentials.
#
# Create the Secret from files, never from a manifest in git:
#   kubectl create secret generic claimward-credentials \
#     --from-file=wg-private-key=./wg-private-key \
#     --from-file=github-client-secret=./github-client-secret
#   (add --from-file=github-token=..., admin-token=..., goauthn-gateway-secret=...)
#
# The pod does NOT run as root. A Secret volume is tmpfs; its files belong to
# ROOT, with the group set by fsGroup, and the mode by defaultMode. The server
# accepts exactly this shape: root-owned, mode 0440, group = the process's gid
# or one of its supplementary groups (fsGroup is applied as one). It still
# refuses 0444/0644, another owner, a foreign group and symlinks.
#
# NET_ADMIN AS A NON-ROOT UID (the honest answer, from capabilities(7), not
# measured here: no cluster was available). The WireGuard (wgctrl), nftables
# and interface-MTU calls all need CAP_NET_ADMIN, and the server binary does
# not acquire it itself (it does no capset/prctl). Kubernetes `add: [NET_ADMIN]`
# puts the capability in the container's bounding and permitted sets, but NO
# ambient capability is set. On execve of a non-root uid the kernel drops the
# permitted set unless the binary carries FILE CAPABILITIES. So `add` alone
# does NOT work for a non-root uid: the binary in the image must be
#   setcap cap_net_admin=+ep /claimward-server
# (e.g. in the image build: `RUN setcap cap_net_admin=+ep /claimward-server`;
# file capabilities need a filesystem that keeps xattrs, which an image layer
# does). allowPrivilegeEscalation: false (no_new_privs) does not forbid this:
# the file capability grants nothing beyond the permitted set `add` already
# gave the container. Without the setcap, either run as uid 0 (and set
# defaultMode 0400, runAsUser 0, runAsNonRoot false) or the first netlink call
# fails with EPERM at start.
#
# The published image (ghcr.io/claimward/claimward-vpn-server, built from the
# Dockerfile at the repository root) already carries that file capability; CI
# reads it back from the final image. A self-built image must do the same.
# The WireGuard interface (wg0) must exist on the node: hostNetwork.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimward-server
spec:
  replicas: 1
  strategy:
    type: Recreate # one control plane per gateway: leases are in memory
  selector:
    matchLabels: {app: claimward-server}
  template:
    metadata:
      labels: {app: claimward-server}
    spec:
      hostNetwork: true
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # the group of the Secret files, see above
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: claimward-server
          image: ghcr.io/claimward/claimward-vpn-server:v0.11.1 # binary has cap_net_admin=+ep
          env:
            - {name: CREDENTIALS_DIRECTORY, value: /run/credentials}
            - {name: WG_ENDPOINT, value: "vpn.example.org:51820"}
            - {name: AUTH_PROVIDER, value: github}
            - {name: GITHUB_ALLOWED_ORGS, value: example-org}
            # Claimward's GitHub OAuth app (public client ID); its secret is the
            # github-client-secret file of the Secret:
            - {name: GITHUB_CLIENT_ID, value: Iv1.0123456789abcdef}
            # /metrics is off unless METRICS_ADDR is set (it names every tenant):
            # - {name: METRICS_ADDR, value: "0.0.0.0:9100"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN] # needs the file capability on the binary, see above
          volumeMounts:
            - {name: credentials, mountPath: /run/credentials, readOnly: true}
      volumes:
        - name: credentials
          secret:
            secretName: claimward-credentials
            defaultMode: 0440 # root:65532 0440, accepted; 0444 is refused
