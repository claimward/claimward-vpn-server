name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test -count=1 ./...

  # The data race detector needs cgo, which the lanes above switch off.
  # The enroll lock, the gRPC stream and the store are concurrent code.
  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go test -race -count=1 ./...

  # Known vulnerabilities in the dependencies this module actually calls.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # The firewall is enforced by the kernel: this lane runs the network
  # namespace test as root and must not skip it.
  netns:
    name: netns (nftables enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: sudo modprobe nf_tables || true
      - run: CGO_ENABLED=0 go test -c -o fw.test ./internal/fw
      # The runner's Docker leaves FORWARD at DROP in its own table, which would
      # drop forwarded packets regardless of claimward's table.
      - run: sudo iptables -P FORWARD ACCEPT || true
      - run: sudo ip6tables -P FORWARD ACCEPT || true
      - run: sudo CW_REQUIRE_NETNS=1 ./fw.test -test.v -test.count=1 -test.run 'TestNetnsPolicyIsEnforced|TestNetnsMSSIsClamped|TestNetnsMSSIsClampedIPv6'
      # The gateway sets its interface MTU itself (SIOCSIFMTU): read it back
      # from a dummy link in a fresh namespace.
      - run: CGO_ENABLED=0 go test -c -o wg.test ./internal/wg
      - run: sudo CW_REQUIRE_NETNS=1 ./wg.test -test.v -test.count=1 -test.run 'TestSetInterfaceMTUOnARealLink'
      - if: failure()
        run: sudo nft list ruleset; sudo iptables -S FORWARD || true

  # The Kubernetes rule (root-owned 0440 file, group = the pod's gid or fsGroup)
  # needs a file really owned by root: chown needs root, so this lane runs
  # the credentials tests as root and a skip there is a failure.
  creds-root:
    name: credentials as root (Kubernetes ownership rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: sudo apt-get install -y --no-install-recommends acl
      - run: CGO_ENABLED=0 go test -c -o creds.test ./internal/creds
      - run: sudo CW_REQUIRE_ROOT=1 ./creds.test -test.v -test.count=1 -test.run 'TestRootOwnedFilesThroughRead|TestSystemdACLCredentialThroughRead'

  # The image's binary must keep cap_net_admin=+ep through the stage copy: a
  # non-root uid has no ambient capabilities, so without the file capability
  # the first netlink call fails with EPERM. The FINAL image is exported and
  # its tar extracted with xattrs; distroless has no getcap to run inside it.
  image:
    name: image (file capability survives the stage copy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends libcap2-bin
      - run: docker build -t claimward-image .
      - run: test "$(docker inspect --format '{{.Config.User}}' claimward-image)" = "65532:65532"
      - run: docker create --name cwx claimward-image
      - run: mkdir -p "$RUNNER_TEMP/img" && docker export -o "$RUNNER_TEMP/img.tar" cwx
      - run: sudo tar --xattrs --xattrs-include=security.capability -xf "$RUNNER_TEMP/img.tar" -C "$RUNNER_TEMP/img" claimward-server
      - run: getcap "$RUNNER_TEMP/img/claimward-server" | grep -E 'cap_net_admin[=+]ep'
      # Control: the same extraction without xattrs must show NO capability, so
      # the check above can fail.
      - run: |
          mkdir -p "$RUNNER_TEMP/noattr"
          sudo tar --no-xattrs -xf "$RUNNER_TEMP/img.tar" -C "$RUNNER_TEMP/noattr" claimward-server
          test -z "$(getcap "$RUNNER_TEMP/noattr/claimward-server")"

  # The Kubernetes manifest is checked against the API schemas, and the unit
  # by systemd itself (a stub binary stands in for the one ExecStart names).
  deploy-validate:
    name: validate deploy/ (kubeconform, systemd-analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary deploy/kubernetes
      - run: sudo install -m 0755 /bin/true /usr/local/bin/claimward-server
      - run: systemd-analyze verify deploy/systemd/claimward-server.service

  # The unit is STARTED, as shipped (DynamicUser=yes, LoadCredentialEncrypted=):
  # systemd hands the credential to the service's dynamic user through a POSIX
  # ACL, which the loader must accept. The only change is a drop-in that sets
  # WG_DRYRUN (the runner has no wg0). The server logs the public key it
  # derives from the credential, so seeing the key we generated in the journal
  # proves the credential was read, not merely that the process stayed up.
  systemd-unit:
    name: start the systemd unit (DynamicUser + credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: sudo apt-get install -y --no-install-recommends wireguard-tools acl
      - run: CGO_ENABLED=0 go build -o claimward-server ./cmd/claimward-server
      - run: sudo install -m 0755 claimward-server /usr/local/bin/claimward-server
      - name: install and start the unit
        run: |
          set -eu
          key="$(wg genkey)"
          pub="$(printf '%s' "$key" | wg pubkey)"
          other="$(wg genkey | wg pubkey)"
          sudo mkdir -p /etc/credstore.encrypted /etc/systemd/system/claimward-server.service.d
          printf '%s\n' "$key" | sudo systemd-creds encrypt --with-key=host --name=wg-private-key - /etc/credstore.encrypted/claimward.wg-private-key
          sudo install -m 0644 deploy/systemd/claimward-server.service /etc/systemd/system/claimward-server.service
          printf '[Service]\nEnvironment=WG_DRYRUN=true\n' | sudo tee /etc/systemd/system/claimward-server.service.d/ci.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl start claimward-server
          timeout 60 sh -c "until sudo journalctl -u claimward-server --no-pager | grep -qF 'server_pubkey=$pub'; do sleep 1; done"
          # Control: a key we did not give it must not be in the journal.
          if sudo journalctl -u claimward-server --no-pager | grep -qF "server_pubkey=$other"; then exit 1; fi
          test "$(systemctl show -p DynamicUser --value claimward-server)" = yes
          test "$(systemctl is-active claimward-server)" = active
          # The shape under test: root-owned, with a named-user ACL.
          sudo getfacl -p /run/credentials/claimward-server.service/wg-private-key | tee acl.txt
          grep -Eq '^user:[^:]+:r--$' acl.txt
      - if: failure()
        run: sudo journalctl -u claimward-server --no-pager; sudo systemctl status claimward-server --no-pager || true

  # OpenBSD: the test binaries are cross-built here and RUN as root inside a
  # real OpenBSD VM (no Go toolchain needed there). CW_REQUIRE_OPENBSD=1 makes
  # a skipped privileged test a failure. The VM is the swappable part: a
  # self-hosted OpenBSD runner can replace the vmactions step.
  openbsd:
    name: openbsd ${{ matrix.release }} (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.9', '8.0']
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=${{ matrix.goarch }} go test -c -o wg.test ./internal/wg
      - uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          envs: 'CW_REQUIRE_OPENBSD'
          run: |
            uname -a
            id -u
            CW_REQUIRE_OPENBSD=1 ./wg.test -test.v -test.count=1 -test.run 'TestIfreqMTUSize|TestSetInterfaceMTUOnARealLink'
        env:
          CW_REQUIRE_OPENBSD: '1'

  crossbuild:
    name: cross-build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build ./...

  # nftables is Linux only: the !linux stub (which refuses to start without a
  # firewall) must keep compiling for development machines.
  devbuild:
    name: dev build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows, openbsd]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=amd64 go build ./... && CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=amd64 go vet ./internal/fw

