name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test -count=1 ./...

  # The data race detector needs cgo, which the lanes above switch off.
  # The enroll lock, the gRPC stream and the store are concurrent code.
  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go test -race -count=1 ./...

  # Known vulnerabilities in the dependencies this module actually calls.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # The firewall is enforced by the kernel: this lane runs the network
  # namespace test as root and must not skip it.
  netns:
    name: netns (nftables enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: sudo modprobe nf_tables || true
      - run: CGO_ENABLED=0 go test -c -o fw.test ./internal/fw
      # The runner's Docker leaves FORWARD at DROP in its own table, which would
      # drop forwarded packets regardless of claimward's table.
      - run: sudo iptables -P FORWARD ACCEPT || true
      - run: sudo ip6tables -P FORWARD ACCEPT || true
      - run: sudo CW_REQUIRE_NETNS=1 ./fw.test -test.v -test.count=1 -test.run 'TestNetnsPolicyIsEnforced|TestNetnsMSSIsClamped|TestNetnsMSSIsClampedIPv6'
      # The gateway sets its interface MTU itself (SIOCSIFMTU): read it back
      # from a dummy link in a fresh namespace.
      - run: CGO_ENABLED=0 go test -c -o wg.test ./internal/wg
      - run: sudo CW_REQUIRE_NETNS=1 ./wg.test -test.v -test.count=1 -test.run 'TestSetInterfaceMTUOnARealLink'
      - if: failure()
        run: sudo nft list ruleset; sudo iptables -S FORWARD || true

  # The Kubernetes rule (root-owned 0440 file, group = the pod's gid or fsGroup)
  # needs a file really owned by root: chown needs root, so this lane runs
  # the credentials tests as root and a skip there is a failure.
  creds-root:
    name: credentials as root (Kubernetes ownership rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: sudo apt-get install -y --no-install-recommends acl
      - run: CGO_ENABLED=0 go test -c -o creds.test ./internal/creds
      - run: sudo CW_REQUIRE_ROOT=1 ./creds.test -test.v -test.count=1 -test.run 'TestRootOwnedFilesThroughRead|TestSystemdACLCredentialThroughRead'

  # The image's binary must keep cap_net_admin=+ep through the stage copy: a
  # non-root uid has no ambient capabilities, so without the file capability
  # the first netlink call fails with EPERM. The FINAL image is exported and
  # its tar extracted with xattrs; distroless has no getcap to run inside it.
  image:
    name: image (file capability survives the stage copy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends libcap2-bin
      - run: docker build -t claimward-image .
      - run: test "$(docker inspect --format '{{.Config.User}}' claimward-image)" = "65532:65532"
      - run: docker create --name cwx claimward-image
      - run: mkdir -p "$RUNNER_TEMP/img" && docker export -o "$RUNNER_TEMP/img.tar" cwx
      - run: sudo tar --xattrs --xattrs-include=security.capability -xf "$RUNNER_TEMP/img.tar" -C "$RUNNER_TEMP/img" claimward-server
      - run: getcap "$RUNNER_TEMP/img/claimward-server" | grep -E 'cap_net_admin[=+]ep'
      # Control: the same extraction without xattrs must show NO capability, so
      # the check above can fail.
      - run: |
          mkdir -p "$RUNNER_TEMP/noattr"
          sudo tar --no-xattrs -xf "$RUNNER_TEMP/img.tar" -C "$RUNNER_TEMP/noattr" claimward-server
          test -z "$(getcap "$RUNNER_TEMP/noattr/claimward-server")"

  # The Kubernetes manifest is checked against the API schemas, and the unit
  # by systemd itself (a stub binary stands in for the one ExecStart names).
  deploy-validate:
    name: validate deploy/ (kubeconform, systemd-analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary deploy/kubernetes
      - run: sudo install -m 0755 /bin/true /usr/local/bin/claimward-server
      - run: systemd-analyze verify deploy/systemd/claimward-server.service

  # The unit is STARTED, as shipped (DynamicUser=yes, LoadCredentialEncrypted=):
  # systemd hands the credential to the service's dynamic user through a POSIX
  # ACL, which the loader must accept. The only change is a drop-in that sets
  # WG_DRYRUN (the runner has no wg0). The server logs the public key it
  # derives from the credential, so seeing the key we generated in the journal
  # proves the credential was read, not merely that the process stayed up.
  systemd-unit:
    name: start the systemd unit (DynamicUser + credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: sudo apt-get install -y --no-install-recommends wireguard-tools acl
      - run: CGO_ENABLED=0 go build -o claimward-server ./cmd/claimward-server
      - run: sudo install -m 0755 claimward-server /usr/local/bin/claimward-server
      - name: install and start the unit
        run: |
          set -eu
          key="$(wg genkey)"
          pub="$(printf '%s' "$key" | wg pubkey)"
          other="$(wg genkey | wg pubkey)"
          sudo mkdir -p /etc/credstore.encrypted /etc/systemd/system/claimward-server.service.d
          printf '%s\n' "$key" | sudo systemd-creds encrypt --with-key=host --name=wg-private-key - /etc/credstore.encrypted/claimward.wg-private-key
          sudo install -m 0644 deploy/systemd/claimward-server.service /etc/systemd/system/claimward-server.service
          printf '[Service]\nEnvironment=WG_DRYRUN=true\n' | sudo tee /etc/systemd/system/claimward-server.service.d/ci.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl start claimward-server
          timeout 60 sh -c "until sudo journalctl -u claimward-server --no-pager | grep -qF 'server_pubkey=\"$pub\"'; do sleep 1; done"
          # Control: a key we did not give it must not be in the journal.
          if sudo journalctl -u claimward-server --no-pager | grep -qF "$other"; then exit 1; fi
          test "$(systemctl show -p DynamicUser --value claimward-server)" = yes
          test "$(systemctl is-active claimward-server)" = active
          # The shape under test: root-owned, with a named-user ACL.
          sudo getfacl -p /run/credentials/claimward-server.service/wg-private-key | tee acl.txt
          grep -Eq '^user:[^:]+:r--$' acl.txt
      - if: failure()
        run: sudo journalctl -u claimward-server --no-pager; sudo systemctl status claimward-server --no-pager || true

  # Hosts without systemd: deploy/s6/claimward-server is run by a real
  # s6-svscan, which starts `sdcreds s6-run`. NOT a dry run: the server drives a
  # real wireguard link and nftables, inside a network namespace of its own so
  # that CAP_NET_ADMIN never touches the runner's. Proved: the server logs the
  # public key derived from the encrypted credential (a control key must be
  # absent), runs as the service user with CapEff == 0x1000 (CAP_NET_ADMIN
  # alone), keeps the secret out of its environment, and the credentials mount is
  # gone after the service stops. A world-readable file is refused (control).
  s6-sdcreds:
    name: start the s6 service (sdcreds, CAP_NET_ADMIN kept)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: sudo apt-get install -y --no-install-recommends wireguard-tools s6
      - run: sudo modprobe wireguard nf_tables || true
      - run: CGO_ENABLED=0 go build -o claimward-server ./cmd/claimward-server
      - run: sudo install -m 0755 claimward-server /usr/local/bin/claimward-server
      - run: GOBIN="$PWD/bin" go install github.com/go-authn/sdcreds/cmd/sdcreds@v0.2.0
      - run: sudo install -m 0755 bin/sdcreds /usr/local/bin/sdcreds
      - name: set up the host, the credential and the scan directory
        run: |
          set -eu
          key="$(wg genkey)"
          echo "pub=$(printf '%s' "$key" | wg pubkey)" >> "$GITHUB_ENV"
          echo "other=$(wg genkey | wg pubkey)" >> "$GITHUB_ENV"
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin claimward
          sudo sdcreds setup
          sudo install -d -m 0755 /etc/claimward /etc/claimward/credentials.encrypted
          printf '%s\n' "$key" | sudo sdcreds encrypt --name=wg-private-key - /etc/claimward/credentials.encrypted/wg-private-key
          printf 'WG_ENDPOINT=vpn.example.org:51820\nAUTH_PROVIDER=github\nGITHUB_ALLOWED_ORGS=example-org\nWG_INTERFACE=wg0\n' | sudo tee /etc/claimward/env >/dev/null
          sudo install -d -m 0755 /etc/s6-scan
          sudo cp -a deploy/s6/claimward-server /etc/s6-scan/claimward-server
          sudo ip netns add cw
          sudo ip netns exec cw ip link set lo up
          sudo ip netns exec cw ip link add wg0 type wireguard
          sudo ip netns exec cw ip link set wg0 up
      - name: start the service under s6-svscan
        run: |
          set -eu
          sudo sh -c "ip netns exec cw s6-svscan /etc/s6-scan > $RUNNER_TEMP/svscan.log 2>&1 &"
          timeout 60 sh -c "until grep -F server_pubkey $RUNNER_TEMP/svscan.log | grep -qF '$pub'; do sleep 1; done"
          cat "$RUNNER_TEMP/svscan.log"
          # Control: a key we did not give it must not be in the log.
          if grep -qF "$other" "$RUNNER_TEMP/svscan.log"; then exit 1; fi
          grep -qF 'dry_run=false' "$RUNNER_TEMP/svscan.log"
      - name: the service runs with CAP_NET_ADMIN alone, as its user, with no secret in its environment
        run: |
          set -eu
          pid="$(sudo pgrep -f '^/usr/local/bin/claimward-server')"
          sudo grep -E '^(Uid|CapEff|CapBnd|CapAmb|NoNewPrivs):' "/proc/$pid/status" | tee status.txt
          grep -Eq '^CapEff:[[:space:]]+0*1000$' status.txt
          grep -Eq '^CapBnd:[[:space:]]+0*1000$' status.txt
          grep -Eq '^NoNewPrivs:[[:space:]]+1$' status.txt
          test "$(awk '/^Uid:/{print $2}' status.txt)" = "$(id -u claimward)"
          # The secret is a file in the private mount, never in the environment.
          sudo cat "/proc/$pid/environ" | tr '\0' '\n' > environ.txt
          grep -q '^CREDENTIALS_DIRECTORY=/run/sdcreds/claimward-server$' environ.txt
          if grep -qiE 'wg_private|admin_token|gateway_secret' environ.txt; then exit 1; fi
          # The mount is private to the service: the host does not see it.
          test ! -e /run/sdcreds/claimward-server/wg-private-key
      - name: control, a credential file that is not safe is refused
        run: |
          set -eu
          # Under /etc: the service user must be able to reach the file, so the
          # refusal is about the mode, not about a directory it cannot enter.
          d=/etc/claimward/badcreds
          sudo install -d -m 0755 "$d"
          sudo sh -c "wg genkey > $d/wg-private-key && chown claimward $d/wg-private-key && chmod 0644 $d/wg-private-key"
          test "$(stat -c %a $d/wg-private-key)" = 644
          if sudo -u claimward env CREDENTIALS_DIRECTORY="$d" WG_DRYRUN=true WG_ENDPOINT=x:1 AUTH_PROVIDER=github GITHUB_ALLOWED_ORGS=x /usr/local/bin/claimward-server > bad.txt 2>&1; then
            cat bad.txt; exit 1
          fi
          cat bad.txt
          grep -q 'has mode 0644' bad.txt
          grep -q 'refused' bad.txt
      - name: stopping the service takes the credentials away
        run: |
          set -eu
          sudo s6-svscanctl -t /etc/s6-scan
          timeout 30 sh -c 'while sudo pgrep -f "^/usr/local/bin/claimward-server" >/dev/null; do sleep 1; done'
          sleep 2
          test ! -e /run/sdcreds/claimward-server
          if grep -q sdcreds /proc/self/mountinfo; then exit 1; fi
      - if: failure()
        run: cat "$RUNNER_TEMP/svscan.log" || true

  # OpenBSD: the test binaries are cross-built here and RUN as root inside a
  # real OpenBSD VM (no Go toolchain needed there). CW_REQUIRE_OPENBSD=1 makes
  # a skipped privileged test a failure. The VM is the swappable part: a
  # self-hosted OpenBSD runner can replace the vmactions step.
  openbsd:
    name: openbsd ${{ matrix.release }} (${{ matrix.goarch }})
    # A self-hosted pool must never execute fork code: same-repo PRs and pushes only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.9', '8.0']
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=${{ matrix.goarch }} go test -c -o wg.test ./internal/wg
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=${{ matrix.goarch }} go test -c -o pf.test ./internal/pf
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=${{ matrix.goarch }} go build -o claimward-server ./cmd/claimward-server
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=${{ matrix.goarch }} go test -c -o rcproof.test ./deploy/openbsd/rcproof
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=${{ matrix.goarch }} go test -c -o privsep.test ./internal/privsep
      - uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          envs: 'CW_REQUIRE_OPENBSD'
          run: |
            set -e
            uname -a
            id -u
            # The parent/child protocol on this kernel: the refusals, the
            # socketpair to a real child process.
            ./privsep.test -test.v -test.count=1
            # The rc.d deployment (deploy/openbsd): install, rcctl start, the
            # startup line, rcctl check, the process split (root parent,
            # _claimward child, unveil+pledge), a peer enrolled through the
            # child that reaches wg0, rcctl stop, a credential the child does
            # not own, and the start that must fail when pf.conf lacks the anchor.
            CW_REQUIRE_OPENBSD=1 CW_SERVER_BIN="$PWD/claimward-server" CW_DEPLOY_DIR="$PWD/deploy/openbsd" ./rcproof.test -test.v -test.count=1
            CW_REQUIRE_OPENBSD=1 ./wg.test -test.v -test.count=1 -test.run 'TestIfreqMTUSize|TestSetInterfaceMTUOnARealLink'
            # WireGuard peers through SIOCSWG (wgctrl's OpenBSD driver is
            # read-only): the structure layout against the release's own
            # <net/if_wg.h>, then add / replace / remove / sweep on a real wg(4).
            CW_REQUIRE_OPENBSD=1 ./wg.test -test.v -test.count=1 -test.run 'TestWGLayoutTableIsTheGeneratedOne|TestWGLayoutAgainstC|TestPeersOnARealWireGuardInterface|TestEncodeAddWithAllowedIPs|TestEncodeRemove|TestEncodeRefusals|FuzzEncodeSet|TestDecodeGet|TestDecodeGetRefusals|FuzzDecodeGet'
            # The pf applier against the real kernel: struct layout vs the
            # release's own header, ioctl load + read-back, pfctl as oracle.
            CW_REQUIRE_OPENBSD=1 ./pf.test -test.v -test.count=1
        env:
          CW_REQUIRE_OPENBSD: '1'

  # The pf structures are generated from each release's own <net/pfvar.h> by
  # cgo -godefs ON the VM. The committed ztypes file must be byte-identical to
  # what BOTH supported releases generate (7.9 and 8.0 share one layout): a
  # release that drifts fails here before the gateway can mis-encode a rule.
  pfabi:
    name: pf ABI ${{ matrix.release }} (${{ matrix.goarch }})
    # A self-hosted pool must never execute fork code: same-repo PRs and pushes only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.9', '8.0']
        goarch: [amd64, arm64]
        include:
          - goarch: amd64
            vmarch: x86_64
          - goarch: arm64
            vmarch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.vmarch }}
          prepare: pkg_add go
          run: |
            uname -a
            go version
            mkdir -p internal/pf/gen
            cd internal/pf/abigen
            GOTOOLCHAIN=local go run gen.go ../gen
            # The WireGuard ioctl structures (SIOCSWG), same contract.
            mkdir -p ../../wg/gen
            cd ../../wg/abigen
            GOTOOLCHAIN=local go run gen.go ../gen
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ztypes-${{ matrix.release }}-${{ matrix.goarch }}
          path: |
            internal/pf/gen/
            internal/wg/gen/
      - run: diff -u internal/pf/ztypes_openbsd_${{ matrix.goarch }}.go internal/pf/gen/ztypes_openbsd_${{ matrix.goarch }}.go
      - run: diff -u internal/wg/zwg_openbsd_${{ matrix.goarch }}.go internal/wg/gen/zwg_openbsd_${{ matrix.goarch }}.go

  crossbuild:
    name: cross-build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build ./...

  # nftables is Linux only: the !linux stub (which refuses to start without a
  # firewall) must keep compiling for development machines.
  devbuild:
    name: dev build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows, openbsd]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=amd64 go build ./... && CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=amd64 go vet ./internal/fw

  # The `openbsd` job runs on amd64 only (no arm64 VMs); the pfabi job checks
  # the arm64 ztypes file's content on a VM but never compiles it. Cross-compile
  # the openbsd/arm64 code here so a compile error cannot stay green.
  devbuild-openbsd-arm64:
    name: dev build (openbsd/arm64)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOOS: openbsd
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go build ./... && go vet ./internal/pf ./internal/wg ./cmd/...
      - run: go test -c -o /dev/null ./internal/pf && go test -c -o /dev/null ./internal/wg && go test -c -o /dev/null ./deploy/openbsd/rcproof && go test -c -o /dev/null ./internal/privsep && go test -c -o /dev/null ./cmd/claimward-server && go vet ./internal/privsep ./cmd/claimward-server

